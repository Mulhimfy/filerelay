name: Build APK

# Every push to main builds a signed APK (downloadable from the run's artifacts).
# Pushing a tag like v1.0.0 also publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.FR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "FR_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No FR_KEYSTORE_B64 secret, so the APK is debug-signed."
          fi

      - name: Build release APK
        env:
          FR_KEYSTORE_PASSWORD: ${{ secrets.FR_KEYSTORE_PASSWORD }}
          FR_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export FR_VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export FR_VERSION_NAME="0.${GITHUB_RUN_NUMBER}-dev"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk FileRelay.apk
          ls -l FileRelay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FileRelay-apk
          path: FileRelay.apk
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" FileRelay.apk \
            --title "FileRelay $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
