name: Emulator smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/smoke/**', '.github/workflows/smoke.yml']

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug-signed is fine here)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk FileRelay.apk

      - name: Test files and Telegram
        run: |
          python3 .github/smoke/make_files.py smoke-files
          curl -sSL -o telegram.apk https://telegram.org/dl/android/apk || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/smoke/run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screens
          path: smoke-out/
